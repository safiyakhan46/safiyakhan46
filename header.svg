<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Safiya Salman Khan — clinical machine learning and LLM evaluation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#0F2A45"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1A3A5C"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FB2" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5AAEE8"/>
      <stop offset="1" stop-color="#7FD1FF"/>
    </linearGradient>
    <style>
      .name  { font: 700 46px Georgia, 'Times New Roman', serif; fill: #F7FAFC; }
      .tag   { font: 500 19px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #5AAEE8; }
      .meta  { font: 400 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8FA6BE; }
      .ecg   { fill: none; stroke: url(#trace); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 4.5s ease-in-out infinite; }
      .edge  { stroke: #2C5A85; stroke-width: 1.2; }
      .node  { fill: #0B1F33; stroke: #5AAEE8; stroke-width: 2; animation: fire 4.5s ease-in-out infinite; }
      .l1 { animation-delay: 2.4s; } .l2 { animation-delay: 2.9s; } .l3 { animation-delay: 3.4s; }
      .fade  { opacity: 0; animation: in 1.2s ease forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1400; } }
      @keyframes fire { 0%, 100% { fill: #0B1F33; } 12% { fill: #5AAEE8; } 30% { fill: #0B1F33; } }
      @keyframes in { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ecg { animation: none; stroke-dashoffset: 0; }
        .node, .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity="0.6"/>

  <text x="64" y="104" class="name fade d1">Safiya Salman Khan</text>
  <text x="66" y="146" class="tag fade d2">clinical ML · LLM evaluation · medical imaging</text>
  <text x="66" y="176" class="meta fade d3">Final-year CS (AI) · ML Intern @ FlyRank AI · Riyadh</text>

  <!-- heartbeat trace that runs into the network -->
  <path class="ecg" d="M40 252 H250 l14 -6 l10 6 h26 l8 10 l12 -62 l12 78 l10 -26 h40 l16 -10 l18 10 H560 l8 10 l12 -62 l12 78 l10 -26 h40 l16 -10 l18 10 H830 L900 150"/>

  <!-- small network: 3 inputs, 4 hidden, 2 outputs -->
  <g>
    <line class="edge" x1="900" y1="90"  x2="1000" y2="70"/>  <line class="edge" x1="900" y1="90"  x2="1000" y2="130"/>
    <line class="edge" x1="900" y1="90"  x2="1000" y2="190"/> <line class="edge" x1="900" y1="90"  x2="1000" y2="250"/>
    <line class="edge" x1="900" y1="150" x2="1000" y2="70"/>  <line class="edge" x1="900" y1="150" x2="1000" y2="130"/>
    <line class="edge" x1="900" y1="150" x2="1000" y2="190"/> <line class="edge" x1="900" y1="150" x2="1000" y2="250"/>
    <line class="edge" x1="900" y1="210" x2="1000" y2="70"/>  <line class="edge" x1="900" y1="210" x2="1000" y2="130"/>
    <line class="edge" x1="900" y1="210" x2="1000" y2="190"/> <line class="edge" x1="900" y1="210" x2="1000" y2="250"/>
    <line class="edge" x1="1000" y1="70"  x2="1100" y2="120"/> <line class="edge" x1="1000" y1="70"  x2="1100" y2="180"/>
    <line class="edge" x1="1000" y1="130" x2="1100" y2="120"/> <line class="edge" x1="1000" y1="130" x2="1100" y2="180"/>
    <line class="edge" x1="1000" y1="190" x2="1100" y2="120"/> <line class="edge" x1="1000" y1="190" x2="1100" y2="180"/>
    <line class="edge" x1="1000" y1="250" x2="1100" y2="120"/> <line class="edge" x1="1000" y1="250" x2="1100" y2="180"/>
  </g>
  <g>
    <circle class="node l1" cx="900"  cy="90"  r="10"/>
    <circle class="node l1" cx="900"  cy="150" r="10"/>
    <circle class="node l1" cx="900"  cy="210" r="10"/>
    <circle class="node l2" cx="1000" cy="70"  r="10"/>
    <circle class="node l2" cx="1000" cy="130" r="10"/>
    <circle class="node l2" cx="1000" cy="190" r="10"/>
    <circle class="node l2" cx="1000" cy="250" r="10"/>
    <circle class="node l3" cx="1100" cy="120" r="10"/>
    <circle class="node l3" cx="1100" cy="180" r="10"/>
  </g>
</svg>
